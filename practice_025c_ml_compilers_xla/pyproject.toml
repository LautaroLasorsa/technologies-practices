[project]
name = "ml-compilers-xla"
version = "0.1.0"
description = "ML Compilers — XLA & HLO Inspection with JAX"
requires-python = ">=3.12"
dependencies = [
    "jax>=0.4.30",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["xla_inspect"]
