services:
  minio:
    image: minio/minio:latest
    container_name: practice_114_minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 3s
      timeout: 3s
      retries: 10
      start_period: 3s

  minio-init:
    image: minio/mc:latest
    container_name: practice_114_minio_init
    depends_on:
      minio:
        condition: service_started
    entrypoint: >
      /bin/sh -c "
      echo 'Waiting for MinIO service...';
      until /usr/bin/mc alias set local http://minio:9000 minioadmin minioadmin 2>/dev/null; do
        sleep 1;
      done;
      echo 'Creating datasets bucket...';
      /usr/bin/mc mb --ignore-existing local/datasets;
      /usr/bin/mc anonymous set download local/datasets;
      echo 'MinIO storage initialized successfully.';
      exit 0;
      "

volumes:
  minio_data:
    name: practice_114_minio_data
